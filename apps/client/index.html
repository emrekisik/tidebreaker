<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tidebreaker.io</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a4a73;
        font-family: system-ui, sans-serif;
        color: #fff;
        user-select: none;
        touch-action: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
      }
      .overlay {
        position: fixed;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      }
      #hint {
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 8px;
        background: rgba(7, 18, 28, 0.55);
        font-size: 15px;
        transition: opacity 1s;
      }
      #hud {
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        width: min(360px, 80vw);
        font-size: 13px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 5px;
      }
      .row span:first-child {
        width: 54px;
        opacity: 0.85;
      }
      .track {
        position: relative;
        flex: 1;
        height: 10px;
        border-radius: 5px;
        background: rgba(7, 18, 28, 0.6);
        overflow: hidden;
      }
      .fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 100%;
      }
      /* Recently lost health is shown in white (width driven by GhostTracker). */
      .ghost {
        background: #fff;
        opacity: 0.9;
      }
      #bar-hull {
        background: #2aa5ff;
      }
      #bar-shield {
        background: #8ff6ff;
      }
      .row.thin .track {
        height: 6px;
      }
      #sunk {
        top: 18px;
        right: 22px;
        font-size: 15px;
      }
      #debug {
        top: 10px;
        left: 10px;
        font:
          12px/1.4 ui-monospace,
          monospace;
        white-space: pre;
        background: rgba(0, 0, 0, 0.55);
        padding: 6px 8px;
        border-radius: 6px;
      }
      #picker {
        top: 96px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        pointer-events: auto;
        font-size: 12px;
      }
      #picker .title {
        opacity: 0.8;
        margin-bottom: 2px;
      }
      #picker button {
        font: inherit;
        color: #fff;
        background: rgba(7, 18, 28, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 4px 10px;
        text-align: left;
        cursor: pointer;
      }
      #picker button:hover {
        background: rgba(40, 90, 130, 0.8);
      }
      #picker .note {
        color: #ff9a8a;
        max-width: 220px;
        line-height: 1.3;
      }
      #picker button.active {
        background: #2f6fb5;
        border-color: #fff;
      }
      #look {
        top: 52px;
        right: 12px;
        width: 232px;
        pointer-events: auto;
        font-size: 12px;
        background: rgba(5, 13, 22, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        padding: 6px 8px;
      }
      #look .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        font-weight: 600;
      }
      #look .body {
        margin-top: 6px;
      }
      #look .body.collapsed {
        display: none;
      }
      #look .line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 4px 0;
      }
      #look input[type='color'] {
        width: 44px;
        height: 22px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: none;
        cursor: pointer;
      }
      #look input[type='range'] {
        width: 96px;
      }
      #look .buttons {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      #look button {
        flex: 1;
        font: inherit;
        color: #fff;
        background: rgba(40, 90, 130, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 4px 6px;
        cursor: pointer;
      }
      #look textarea {
        width: 100%;
        height: 118px;
        margin-top: 6px;
        box-sizing: border-box;
        font:
          11px/1.35 ui-monospace,
          monospace;
        color: #cfe9ff;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        resize: none;
      }
      #minimap {
        left: 12px;
        bottom: 12px;
        padding: 4px;
        border-radius: 8px;
        background: rgba(5, 13, 22, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      #minimap canvas {
        display: block;
        border-radius: 5px;
      }
      #minimap.big {
        left: 50%;
        top: 50%;
        bottom: auto;
        transform: translate(-50%, -50%);
        background: rgba(5, 13, 22, 0.8);
        padding: 8px;
      }
      #storm {
        inset: 0;
        opacity: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(10, 24, 34, 0) 45%,
          rgba(14, 28, 40, 0.88) 100%
        );
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 90px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 2px 6px #000;
      }
      #dmg-layer {
        inset: 0;
      }
      .dmg {
        position: absolute;
        transform: translate(-50%, -50%);
        font-weight: 700;
        font-size: 20px;
        color: #ffd84d;
        opacity: 0;
      }
      .dmg.shield {
        color: #7fdcff;
      }
      .dmg.pop {
        animation: pop 0.8s ease-out forwards;
      }
      @keyframes pop {
        0% {
          opacity: 1;
          margin-top: 0;
        }
        100% {
          opacity: 0;
          margin-top: -42px;
        }
      }
      #menu {
        inset: 0;
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(3, 14, 24, 0.55);
        transition: opacity 0.4s;
      }
      #menu-card {
        width: 340px;
        padding: 24px 26px;
        border-radius: 14px;
        background: rgba(7, 22, 36, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.2);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #menu-card h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: 0.04em;
      }
      #menu-card .sub {
        margin: 0;
        font-size: 13px;
        opacity: 0.8;
      }
      #menu-card label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        opacity: 0.9;
      }
      #menu-card input,
      #menu-card select {
        font: inherit;
        font-size: 16px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
      }
      #menu-play {
        font: inherit;
        font-size: 18px;
        font-weight: 700;
        padding: 10px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(#2e9bff, #1b6fd0);
      }
      #menu-play:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #menu-note {
        min-height: 18px;
        font-size: 13px;
      }
      #menu-note.error {
        color: #ff8f8f;
      }
      #menu-offline {
        font-size: 12px;
        color: #9fd0ff;
      }
      #match {
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 6px 12px;
        border-radius: 10px;
        background: rgba(5, 13, 22, 0.6);
      }
      #match .side {
        width: 230px;
        font-size: 11px;
      }
      #match .side .track {
        height: 12px;
        margin-top: 3px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #match .side .track.thin {
        height: 5px;
      }
      #match .side.blue .fill {
        background: #4aa8ff;
      }
      #match .side.red .fill {
        background: #ff5a68;
      }
      #match .side .fill.shield {
        background: #8ff6ff;
      }
      #match .fill {
        height: 100%;
        width: 100%;
      }
      #m-kills {
        font-size: 22px;
        font-weight: 700;
        min-width: 70px;
        text-align: center;
      }
      #banner {
        top: 30%;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        transition: opacity 0.25s;
      }
      #banner-title {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: 0.03em;
        text-shadow: 0 3px 12px #000;
      }
      #banner-sub {
        margin-top: 6px;
        font-size: 20px;
      }
      #killfeed {
        top: 14px;
        left: 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 14px;
        font-weight: 600;
      }
      .feed-row {
        align-self: flex-start;
        padding: 3px 10px;
        border-radius: 6px;
        background: rgba(5, 13, 22, 0.55);
        transition: opacity 0.6s;
      }
      .feed-row.mine {
        border-left: 3px solid #ffd84d;
        background: rgba(5, 13, 22, 0.75);
      }
      .feed-row.fading {
        opacity: 0;
      }
      .feed-blue {
        color: #8cc8ff;
      }
      .feed-red {
        color: #ff97a2;
      }
      .feed-arrow {
        opacity: 0.75;
      }
      #scoreboard {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        gap: 18px;
        width: min(720px, 92vw);
        padding: 14px 16px;
        border-radius: 12px;
        background: rgba(5, 13, 22, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.2);
        font-size: 14px;
      }
      .sb-col {
        flex: 1;
        min-width: 0;
      }
      .sb-row {
        display: flex;
        gap: 8px;
        padding: 3px 8px;
        border-radius: 5px;
      }
      .sb-row.me {
        background: rgba(255, 255, 255, 0.16);
        font-weight: 700;
      }
      .sb-head {
        font-weight: 700;
        border-bottom: 1px solid rgba(255, 255, 255, 0.25);
        margin-bottom: 3px;
      }
      .sb-col.blue .sb-head .sb-name {
        color: #8cc8ff;
      }
      .sb-col.red .sb-head .sb-name {
        color: #ff97a2;
      }
      .sb-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sb-num {
        width: 62px;
        text-align: right;
      }
      /* Start screen: only the sea and the menu. */
      body.in-menu #hud,
      body.in-menu #hint,
      body.in-menu #sunk,
      body.in-menu #picker,
      body.in-menu #minimap,
      body.in-menu #killfeed,
      body.in-menu #storm {
        display: none;
      }
      .hidden {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body class="in-menu">
    <canvas id="game"></canvas>
    <div id="menu" class="overlay hidden">
      <form id="menu-card" autocomplete="off">
        <h1>Tidebreaker</h1>
        <p class="sub" data-i18n="menu.goal"></p>
        <label><span data-i18n="menu.name"></span><input id="menu-name" maxlength="16" /></label>
        <label
          ><span data-i18n="menu.ship"></span
          ><select id="menu-ship"></select
        ></label>
        <button id="menu-play" type="submit" data-i18n="menu.play"></button>
        <div id="menu-note"></div>
        <a id="menu-offline" href="?offline=1" data-i18n="menu.offline"></a>
      </form>
    </div>
    <div id="match" class="overlay hidden">
      <div class="side blue">
        <span data-i18n="match.blue"></span> <span data-i18n="match.carrier"></span>
        <div class="track"><div id="m-blue-hull" class="fill"></div></div>
        <div class="track thin"><div id="m-blue-shield" class="fill shield"></div></div>
      </div>
      <div id="m-kills">0 : 0</div>
      <div class="side red">
        <span data-i18n="match.red"></span> <span data-i18n="match.carrier"></span>
        <div class="track"><div id="m-red-hull" class="fill"></div></div>
        <div class="track thin"><div id="m-red-shield" class="fill shield"></div></div>
      </div>
    </div>
    <div id="killfeed" class="overlay"></div>
    <div id="scoreboard" class="overlay hidden"></div>
    <div id="banner" class="overlay hidden">
      <div id="banner-title"></div>
      <div id="banner-sub"></div>
    </div>
    <div id="minimap" class="overlay"></div>
    <div id="storm" class="overlay"><span data-i18n="hud.storm"></span></div>
    <div id="dmg-layer" class="overlay"></div>
    <div id="hint" class="overlay" data-i18n="hint.controls"></div>
    <div id="sunk" class="overlay">
      <span data-i18n="hud.sunk"></span>: <b id="sunk-count">0</b>
    </div>
    <div id="hud" class="overlay">
      <div class="row thin">
        <span data-i18n="hud.shield"></span>
        <div class="track">
          <div id="ghost-shield" class="fill ghost"></div>
          <div id="bar-shield" class="fill"></div>
        </div>
      </div>
      <div class="row">
        <span data-i18n="hud.hull"></span>
        <div class="track">
          <div id="ghost-hull" class="fill ghost"></div>
          <div id="bar-hull" class="fill"></div>
        </div>
      </div>
    </div>
    <div id="picker" class="overlay"><div class="title" data-i18n="picker.title"></div></div>
    <div id="look" class="overlay"></div>
    <div id="debug" class="overlay hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

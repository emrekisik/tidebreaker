<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tidebreaker.io</title>
    <link rel="stylesheet" href="/src/ui/theme.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a4a73;
        font-family: system-ui, sans-serif;
        color: #fff;
        user-select: none;
        touch-action: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
      }
      .overlay {
        position: fixed;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      }
      #debug {
        top: 10px;
        left: 10px;
        font:
          12px/1.4 ui-monospace,
          monospace;
        white-space: pre;
        background: rgba(0, 0, 0, 0.55);
        padding: 6px 8px;
        border-radius: 6px;
      }
      #picker {
        top: 96px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        pointer-events: auto;
        font-size: 12px;
      }
      #picker .title {
        opacity: 0.8;
        margin-bottom: 2px;
      }
      #picker button {
        font: inherit;
        color: #fff;
        background: rgba(7, 18, 28, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 4px 10px;
        text-align: left;
        cursor: pointer;
      }
      #picker button:hover {
        background: rgba(40, 90, 130, 0.8);
      }
      #picker .note {
        color: #ff9a8a;
        max-width: 220px;
        line-height: 1.3;
      }
      #picker button.active {
        background: #2f6fb5;
        border-color: #fff;
      }
      #look {
        top: 52px;
        right: 12px;
        width: 232px;
        pointer-events: auto;
        font-size: 12px;
        background: rgba(5, 13, 22, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        padding: 6px 8px;
      }
      #look .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        font-weight: 600;
      }
      #look .body {
        margin-top: 6px;
      }
      #look .body.collapsed {
        display: none;
      }
      #look .line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 4px 0;
      }
      #look input[type='color'] {
        width: 44px;
        height: 22px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: none;
        cursor: pointer;
      }
      #look input[type='range'] {
        width: 96px;
      }
      #look .buttons {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      #look button {
        flex: 1;
        font: inherit;
        color: #fff;
        background: rgba(40, 90, 130, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 4px 6px;
        cursor: pointer;
      }
      #look textarea {
        width: 100%;
        height: 118px;
        margin-top: 6px;
        box-sizing: border-box;
        font:
          11px/1.35 ui-monospace,
          monospace;
        color: #cfe9ff;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        resize: none;
      }
      #storm {
        inset: 0;
        opacity: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(10, 24, 34, 0) 45%,
          rgba(14, 28, 40, 0.88) 100%
        );
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 90px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 2px 6px #000;
      }
      #dmg-layer {
        inset: 0;
      }
      .dmg {
        position: absolute;
        transform: translate(-50%, -50%);
        font-weight: 700;
        font-size: 20px;
        color: #ffd84d;
        opacity: 0;
      }
      .dmg.shield {
        color: #7fdcff;
      }
      .dmg.pop {
        animation: pop 0.8s ease-out forwards;
      }
      @keyframes pop {
        0% {
          opacity: 1;
          margin-top: 0;
        }
        100% {
          opacity: 0;
          margin-top: -42px;
        }
      }
      #menu {
        inset: 0;
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(3, 14, 24, 0.55);
        transition: opacity 0.4s;
      }
      .dmg.gain {
        color: #8dff9c;
      }
      /* Start screen: only the sea and the menu. */
      body.in-menu #hud,
      body.in-menu #hint,
      body.in-menu #sunk,
      body.in-menu #picker,
      body.in-menu #minimap,
      body.in-menu #killfeed,
      body.in-menu #upgrades,
      body.in-menu #rigs,
      body.in-menu #progress,
      body.in-menu #storm {
        display: none;
      }
      .hidden {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body class="in-menu">
    <canvas id="game"></canvas>
    <div id="menu" class="overlay hidden">
      <form id="menu-card" class="panel" autocomplete="off">
        <h1 lang="en">Tidebreaker</h1>
        <p class="sub" data-i18n="menu.goal"></p>
        <label><span data-i18n="menu.name"></span><input id="menu-name" maxlength="16" /></label>
        <label
          ><span data-i18n="menu.ship"></span
          ><select id="menu-ship"></select
        ></label>
        <button id="menu-play" type="submit" data-i18n="menu.play"></button>
        <div id="menu-note"></div>
        <a id="menu-offline" href="?offline=1" data-i18n="menu.offline"></a>
      </form>
    </div>
    <div id="match" class="overlay hidden">
      <img class="m-ship blue" alt="" src="/icons/ships/side/blue/aircraft_carrier.png" />
      <div class="m-bars blue">
        <div class="m-bar hull"><div id="m-blue-hull" class="fill"></div></div>
        <div class="m-bar shield"><div id="m-blue-shield" class="fill"></div></div>
      </div>
      <div id="m-kills">0 : 0</div>
      <div class="m-bars red">
        <div class="m-bar hull"><div id="m-red-hull" class="fill"></div></div>
        <div class="m-bar shield"><div id="m-red-shield" class="fill"></div></div>
      </div>
      <img class="m-ship red" alt="" src="/icons/ships/side/red/aircraft_carrier.png" />
    </div>
    <div id="rigs" class="overlay hidden"></div>
    <div id="progress" class="overlay hidden">
      <div id="p-cards"></div>
      <button id="p-tier" type="button"></button>
    </div>
    <div id="upgrades" class="overlay hidden"><div id="p-stats"></div></div>
    <div id="killfeed" class="overlay"></div>
    <div id="scoreboard" class="overlay panel hidden"></div>
    <div id="banner" class="overlay hidden">
      <div id="banner-title"></div>
      <div id="banner-sub"></div>
    </div>
    <div id="minimap" class="overlay panel"></div>
    <div id="storm" class="overlay"><span data-i18n="hud.storm"></span></div>
    <div id="dmg-layer" class="overlay"></div>
    <div id="hint" class="overlay panel" data-i18n="hint.controls"></div>
    <div id="sunk" class="overlay panel">
      <span data-i18n="hud.sunk"></span>: <b id="sunk-count">0</b>
    </div>
    <div id="hud" class="overlay panel">
      <div class="hud-lives">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 21.5S2.5 15.4 2.5 8.9C2.5 5.6 5 3.5 7.6 3.5c1.9 0 3.5 1 4.4 2.6.9-1.6 2.5-2.6 4.4-2.6 2.6 0 5.1 2.1 5.1 5.4 0 6.5-9.5 12.6-9.5 12.6z"
            fill="currentColor"
          />
        </svg>
        <b id="hud-lives">3</b>
      </div>
      <div class="hud-bars">
        <div class="bar-line hull">
          <span class="bar-label" data-i18n="hud.hull"></span>
          <div class="track">
            <div id="ghost-hull" class="fill ghost"></div>
            <div id="bar-hull" class="fill"></div>
          </div>
          <span id="num-hull" class="bar-num"></span>
        </div>
        <div class="bar-line shield">
          <span class="bar-label" data-i18n="hud.shield"></span>
          <div class="track">
            <div id="ghost-shield" class="fill ghost"></div>
            <div id="bar-shield" class="fill"></div>
          </div>
          <span id="num-shield" class="bar-num"></span>
        </div>
      </div>
      <div class="hud-money">
        <span class="hud-cash"
          ><span id="hud-cash-ico" class="ico"></span><span id="hud-cash">0</span></span
        >
        <span class="hud-xp" id="hud-xp">XP 0</span>
      </div>
      <div class="hud-xprow">
        <span class="hud-lv" id="hud-lv">LV 1</span>
        <div class="hud-xpbar"><div id="hud-xpfill"></div></div>
      </div>
    </div>
    <div id="picker" class="overlay"><div class="title" data-i18n="picker.title"></div></div>
    <div id="look" class="overlay"></div>
    <div id="debug" class="overlay hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

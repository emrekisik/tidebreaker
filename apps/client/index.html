<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tidebreaker.io</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a4a73;
        font-family: system-ui, sans-serif;
        color: #fff;
        user-select: none;
        touch-action: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
      }
      .overlay {
        position: fixed;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      }
      #hint {
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 8px;
        background: rgba(7, 18, 28, 0.55);
        font-size: 15px;
        transition: opacity 1s;
      }
      #hud {
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        width: min(360px, 80vw);
        font-size: 13px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 5px;
      }
      .row span:first-child {
        width: 54px;
        opacity: 0.85;
      }
      .track {
        position: relative;
        flex: 1;
        height: 10px;
        border-radius: 5px;
        background: rgba(7, 18, 28, 0.6);
        overflow: hidden;
      }
      .fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 100%;
      }
      /* Recently lost health is shown in white (width driven by GhostTracker). */
      .ghost {
        background: #fff;
        opacity: 0.9;
      }
      #bar-hull {
        background: #2aa5ff;
      }
      #bar-shield {
        background: #8ff6ff;
      }
      .row.thin .track {
        height: 6px;
      }
      #sunk {
        top: 18px;
        right: 22px;
        font-size: 15px;
      }
      #debug {
        top: 10px;
        left: 10px;
        font:
          12px/1.4 ui-monospace,
          monospace;
        white-space: pre;
        background: rgba(0, 0, 0, 0.55);
        padding: 6px 8px;
        border-radius: 6px;
      }
      #picker {
        top: 96px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        pointer-events: auto;
        font-size: 12px;
      }
      #picker .title {
        opacity: 0.8;
        margin-bottom: 2px;
      }
      #picker button {
        font: inherit;
        color: #fff;
        background: rgba(7, 18, 28, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 4px 10px;
        text-align: left;
        cursor: pointer;
      }
      #picker button:hover {
        background: rgba(40, 90, 130, 0.8);
      }
      #picker .note {
        color: #ff9a8a;
        max-width: 220px;
        line-height: 1.3;
      }
      #picker button.active {
        background: #2f6fb5;
        border-color: #fff;
      }
      #look {
        top: 52px;
        right: 12px;
        width: 232px;
        pointer-events: auto;
        font-size: 12px;
        background: rgba(5, 13, 22, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        padding: 6px 8px;
      }
      #look .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        font-weight: 600;
      }
      #look .body {
        margin-top: 6px;
      }
      #look .body.collapsed {
        display: none;
      }
      #look .line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 4px 0;
      }
      #look input[type='color'] {
        width: 44px;
        height: 22px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: none;
        cursor: pointer;
      }
      #look input[type='range'] {
        width: 96px;
      }
      #look .buttons {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      #look button {
        flex: 1;
        font: inherit;
        color: #fff;
        background: rgba(40, 90, 130, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 4px 6px;
        cursor: pointer;
      }
      #look textarea {
        width: 100%;
        height: 118px;
        margin-top: 6px;
        box-sizing: border-box;
        font:
          11px/1.35 ui-monospace,
          monospace;
        color: #cfe9ff;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        resize: none;
      }
      #minimap {
        left: 12px;
        bottom: 12px;
        padding: 4px;
        border-radius: 8px;
        background: rgba(5, 13, 22, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      #minimap canvas {
        display: block;
        border-radius: 5px;
      }
      #minimap.big {
        left: 50%;
        top: 50%;
        bottom: auto;
        transform: translate(-50%, -50%);
        background: rgba(5, 13, 22, 0.8);
        padding: 8px;
      }
      #storm {
        inset: 0;
        opacity: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(10, 24, 34, 0) 45%,
          rgba(14, 28, 40, 0.88) 100%
        );
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 90px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 2px 6px #000;
      }
      #dmg-layer {
        inset: 0;
      }
      .dmg {
        position: absolute;
        transform: translate(-50%, -50%);
        font-weight: 700;
        font-size: 20px;
        color: #ffd84d;
        opacity: 0;
      }
      .dmg.shield {
        color: #7fdcff;
      }
      .dmg.pop {
        animation: pop 0.8s ease-out forwards;
      }
      @keyframes pop {
        0% {
          opacity: 1;
          margin-top: 0;
        }
        100% {
          opacity: 0;
          margin-top: -42px;
        }
      }
      .hidden {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="minimap" class="overlay"></div>
    <div id="storm" class="overlay"><span data-i18n="hud.storm"></span></div>
    <div id="dmg-layer" class="overlay"></div>
    <div id="hint" class="overlay" data-i18n="hint.controls"></div>
    <div id="sunk" class="overlay">
      <span data-i18n="hud.sunk"></span>: <b id="sunk-count">0</b>
    </div>
    <div id="hud" class="overlay">
      <div class="row thin">
        <span data-i18n="hud.shield"></span>
        <div class="track">
          <div id="ghost-shield" class="fill ghost"></div>
          <div id="bar-shield" class="fill"></div>
        </div>
      </div>
      <div class="row">
        <span data-i18n="hud.hull"></span>
        <div class="track">
          <div id="ghost-hull" class="fill ghost"></div>
          <div id="bar-hull" class="fill"></div>
        </div>
      </div>
    </div>
    <div id="picker" class="overlay"><div class="title" data-i18n="picker.title"></div></div>
    <div id="look" class="overlay"></div>
    <div id="debug" class="overlay hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
